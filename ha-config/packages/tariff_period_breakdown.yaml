            - states('sensor.energy_cost_yesterday') | float(0)) | round(2) }}

      # ─── GROSS vs NET ───────────────────────────────────────────
      # "Avoided cost" is the GROSS figure: what the energy the battery and
      # solar supplied would have cost had it been bought from the grid at the
      # rate in force when it was used. Subtracting battery_charge_cost gives
