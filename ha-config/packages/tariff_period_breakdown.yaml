        # cycle that ran only part of the day -- which is not visible in the
        # meter values themselves, only by comparing them against the inverter's
        # own daily total.
        #
        # Measured 2026-09-06: the meters held 1.18 kWh of import against the
        # inverter's 16 kWh, because they were created at 13:47 the day before.
        # Every yesterday figure derived from them was wrong, and the effective
        # unit rate was inflated by dividing a real cost by a third of a day's
        # energy. A tolerance of 10%, or 1 kWh on a very low-import day.
        #
        # The `inverter == 0` arm keeps these available on a genuine zero-import
        # day rather than treating that as missing data.
        availability: >
          {% set metered = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) %}
          {% set inverter = states('sensor.solis_s6_eh1p_yesterday_energy_imported_from_grid') | float(0) %}
          {% if inverter == 0 %}
            true
          {% else %}
            {{ metered > 0 and (metered - inverter) | abs <= [inverter * 0.1, 1.0] | max }}
          {% endif %}
        state: >
          {% set imp = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0) + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0) + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0) + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) %}
          {% set chg = state_attr('sensor.battery_charge_daily_night_boost', 'last_period') | float(0) + state_attr('sensor.battery_charge_daily_night', 'last_period') | float(0) + state_attr('sensor.battery_charge_daily_day', 'last_period') | float(0) + state_attr('sensor.battery_charge_daily_peak', 'last_period') | float(0) %}
          {% set dis = state_attr('sensor.battery_discharge_daily_night_boost', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_night', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_day', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_peak', 'last_period') | float(0) %}
          {% set sol = state_attr('sensor.solar_daily_night_boost', 'last_period') | float(0) + state_attr('sensor.solar_daily_night', 'last_period') | float(0) + state_attr('sensor.solar_daily_day', 'last_period') | float(0) + state_attr('sensor.solar_daily_peak', 'last_period') | float(0) %}
          {{ ([dis + sol + imp - chg, 0] | max) | round(2) }}

      # ─── PERFORMANCE ────────────────────────────────────────────
      # Ratios that say whether the system is doing its job, as opposed to how
      # much energy moved. Each guards its own divisor: a ratio with nothing to
      # divide by is unavailable, never 0% or 100%.
      - name: "Battery Round Trip Efficiency"
        unique_id: battery_round_trip_efficiency
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-sync
        availability: "{{ states('sensor.solis_s6_eh1p_total_battery_charge_energy') | float(0) > 0 }}"
        state: >
          {{ ((states('sensor.solis_s6_eh1p_total_battery_discharge_energy') | float(0)
             / states('sensor.solis_s6_eh1p_total_battery_charge_energy') | float(1)) * 100) | round(1) }}

      # Deliberately lifetime-only as a headline, but the daily figure is useful
      # for spotting a bad day. Expect it to swing either side of the lifetime
      # number purely from the battery ending the day fuller or emptier than it
      # started -- a single day is not an efficiency measurement.
      - name: "Battery Round Trip Efficiency Today"
        unique_id: battery_round_trip_efficiency_today
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-sync
        availability: "{{ states('sensor.solis_s6_eh1p_today_battery_charge_energy') | float(0) > 0 }}"
        state: >
          {{ ((states('sensor.solis_s6_eh1p_today_battery_discharge_energy') | float(0)
             / states('sensor.solis_s6_eh1p_today_battery_charge_energy') | float(1)) * 100) | round(1) }}

      # All-in: includes the standing charge, so this is what a kWh actually
      # costs once the daily fee is spread over what was used.
      #
      # Read the TODAY figure with care. On an arbitrage system the cost lands
      # hours before the benefit: the battery is paid for at 02:00 and pays back
      # from 08:00, so this reads high all morning and falls through the day.
      # Measured 2026-09-06 at 09:00 it was 0.4107 against a completed-day
      # figure of 0.1200 for the day before. The yesterday sensor below is the
      # one to judge performance on.
      - name: "Effective Unit Rate Today"
        unique_id: effective_unit_rate_today
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:tag-text
        availability: "{{ states('sensor.house_energy_today') | float(0) > 0 }}"
        state: >
          {{ (states('sensor.energy_cost_today') | float(0)
             / states('sensor.house_energy_today') | float(1)) | round(4) }}

      # A completed day, so free of the intraday swing above. This is the
      # honest answer to "am I beating the tariff": compare it against the day
      # rate the household would otherwise have paid.
      - name: "Effective Unit Rate Yesterday"
        unique_id: effective_unit_rate_yesterday
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:tag-text
        # Unavailable rather than falsely reporting a figure when the meters
        # do not hold a whole day. Two ways that happens: no completed cycle at
        # all (first day after install, or HA down across the rollover), or a
        # cycle that ran only part of the day -- which is not visible in the
        # meter values themselves, only by comparing them against the inverter's
        # own daily total.
        #
        # Measured 2026-09-06: the meters held 1.18 kWh of import against the
        # inverter's 16 kWh, because they were created at 13:47 the day before.
        # Every yesterday figure derived from them was wrong, and the effective
        # unit rate was inflated by dividing a real cost by a third of a day's
        # energy. A tolerance of 10%, or 1 kWh on a very low-import day.
        #
        # The `inverter == 0` arm keeps these available on a genuine zero-import
        # day rather than treating that as missing data.
        availability: >
          {% set metered = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) %}
          {% set inverter = states('sensor.solis_s6_eh1p_yesterday_energy_imported_from_grid') | float(0) %}
          {% if inverter == 0 %}
            true
          {% else %}
            {{ metered > 0 and (metered - inverter) | abs <= [inverter * 0.1, 1.0] | max }}
          {% endif %}
        state: >
          {% set load = states('sensor.house_energy_yesterday') | float(0) %}
          {% if load > 0 %}
            {{ (states('sensor.energy_cost_yesterday') | float(0) / load) | round(4) }}
          {% else %}
            unknown
          {% endif %}

      # Share of the house's demand met by the battery and solar rather than by
      # importing at the moment of use.
      - name: "Self Sufficiency Today"
        unique_id: self_sufficiency_today
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:home-lightning-bolt
        availability: "{{ states('sensor.house_energy_today') | float(0) > 0 }}"
        state: >
          {% set load = states('sensor.house_energy_today') | float(1) %}
          {% set own = states('sensor.solis_s6_eh1p_today_battery_discharge_energy') | float(0)
                     + states('sensor.solar_today_kwh') | float(0) %}
          {{ [ (own / load * 100), 100 ] | min | round(1) }}

      # The worst-priced energy. Lower is better; zero is the goal.
      - name: "Peak Import Share Today"
        unique_id: peak_import_share_today
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:transmission-tower
        availability: >
          {{ (states('sensor.grid_import_daily_night_boost') | float(0)
            + states('sensor.grid_import_daily_night') | float(0)
            + states('sensor.grid_import_daily_day') | float(0)
            + states('sensor.grid_import_daily_peak') | float(0)) > 0 }}
        state: >
          {% set total = states('sensor.grid_import_daily_night_boost') | float(0)
                       + states('sensor.grid_import_daily_night') | float(0)
                       + states('sensor.grid_import_daily_day') | float(0)
                       + states('sensor.grid_import_daily_peak') | float(1) %}
          {{ ((states('sensor.grid_import_daily_peak') | float(0) / total) * 100) | round(1) }}

      # How much of the bill is the fixed daily fee -- the part no amount of
      # optimisation can touch. At EUR 1.1120/day it is roughly EUR 334 a year.
      - name: "Standing Charge Share Today"
        unique_id: standing_charge_share_today
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:calendar-clock
        availability: "{{ states('sensor.energy_cost_today') | float(0) > 0 }}"
        state: >
          {{ ((states('input_number.daily_fixed_charge') | float(1.1120) / states('sensor.energy_cost_today') | float(1)) * 100) | round(1) }}

      - name: "Battery Equivalent Full Cycles"
        unique_id: battery_equivalent_full_cycles
        state_class: total_increasing
        icon: mdi:battery-clock
        availability: "{{ states('input_number.battery_capacity_kwh') | float(0) > 0 }}"
        state: >
          {{ (states('sensor.solis_s6_eh1p_total_battery_charge_energy') | float(0)
             / states('input_number.battery_capacity_kwh') | float(1)) | round(1) }}

      # Straight-line projection from the running average. It assumes the future
      # looks like the past, which it will not exactly -- treat it as an
      # order-of-magnitude answer, not a date.
      - name: "Payback Years Remaining"
        unique_id: payback_years_remaining
        unit_of_measurement: "years"
        state_class: measurement
        icon: mdi:cash-clock
        availability: "{{ states('sensor.average_daily_saving') | float(0) > 0 }}"
        state: >
          {% set remaining = states('input_number.system_cost') | float(0)
                           - states('sensor.total_energy_saving') | float(0) %}
          {{ ([remaining, 0] | max / (states('sensor.average_daily_saving') | float(1) * 365)) | round(2) }}

      # Avoided cost split by source. The combined figure hides that solar can be
      # a large share of it -- measured 2026-09-05, 42% on a day the owner
      # described solar as "minor". Splitting it answers "what is the solar
      # actually worth" without a separate mental model.
      #
      # Solar is valued at the rate of the period it was generated in, so
      # midday output is worth the day rate and late output the peak rate.
      # sensor.solar_value_today values all solar at the day rate instead and is
      # therefore the less accurate of the two; prefer this one.
      #
      # CAVEAT: if solar ever charges the battery, that energy is counted here
      # once as solar and again as discharge. This system charges at night from
      # the grid, so the overlap is currently zero -- but it would silently
      # overstate the saving if daytime charging began.
      - name: "Avoided Cost Battery Today"
        unique_id: avoided_cost_battery_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:battery-arrow-down
        state: >
          {% set nb = states('sensor.battery_discharge_daily_night_boost') | float(0) * (states('input_number.rate_night_boost') | float(0.1123)) %}
          {% set ni = states('sensor.battery_discharge_daily_night') | float(0) * (states('input_number.rate_night') | float(0.2778)) %}
          {% set da = states('sensor.battery_discharge_daily_day') | float(0) * (states('input_number.rate_day') | float(0.3578)) %}
          {% set pe = states('sensor.battery_discharge_daily_peak') | float(0) * (states('input_number.rate_peak') | float(0.4615)) %}
          {{ (nb + ni + da + pe) | round(2) }}

      - name: "Avoided Cost Solar Today"
        unique_id: avoided_cost_solar_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {% set nb = states('sensor.solar_daily_night_boost') | float(0) * (states('input_number.rate_night_boost') | float(0.1123)) %}
          {% set ni = states('sensor.solar_daily_night') | float(0) * (states('input_number.rate_night') | float(0.2778)) %}
          {% set da = states('sensor.solar_daily_day') | float(0) * (states('input_number.rate_day') | float(0.3578)) %}
          {% set pe = states('sensor.solar_daily_peak') | float(0) * (states('input_number.rate_peak') | float(0.4615)) %}
          {{ (nb + ni + da + pe) | round(2) }}

      - name: "Avoided Cost Battery Yesterday"
        unique_id: avoided_cost_battery_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:battery-arrow-down
        # Unavailable rather than falsely reporting a figure when the meters
        # do not hold a whole day. Two ways that happens: no completed cycle at
        # all (first day after install, or HA down across the rollover), or a
        # cycle that ran only part of the day -- which is not visible in the
        # meter values themselves, only by comparing them against the inverter's
        # own daily total.
        #
        # Measured 2026-09-06: the meters held 1.18 kWh of import against the
        # inverter's 16 kWh, because they were created at 13:47 the day before.
        # Every yesterday figure derived from them was wrong, and the effective
        # unit rate was inflated by dividing a real cost by a third of a day's
        # energy. A tolerance of 10%, or 1 kWh on a very low-import day.
        #
        # The `inverter == 0` arm keeps these available on a genuine zero-import
        # day rather than treating that as missing data.
        availability: >
          {% set metered = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) %}
          {% set inverter = states('sensor.solis_s6_eh1p_yesterday_energy_imported_from_grid') | float(0) %}
          {% if inverter == 0 %}
            true
          {% else %}
            {{ metered > 0 and (metered - inverter) | abs <= [inverter * 0.1, 1.0] | max }}
          {% endif %}
        state: >
          {% set nb = state_attr('sensor.battery_discharge_daily_night_boost', 'last_period') | float(0) * (states('input_number.rate_night_boost') | float(0.1123)) %}
          {% set ni = state_attr('sensor.battery_discharge_daily_night', 'last_period') | float(0) * (states('input_number.rate_night') | float(0.2778)) %}
          {% set da = state_attr('sensor.battery_discharge_daily_day', 'last_period') | float(0) * (states('input_number.rate_day') | float(0.3578)) %}
          {% set pe = state_attr('sensor.battery_discharge_daily_peak', 'last_period') | float(0) * (states('input_number.rate_peak') | float(0.4615)) %}
          {{ (nb + ni + da + pe) | round(2) }}

      - name: "Avoided Cost Solar Yesterday"
        unique_id: avoided_cost_solar_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:solar-power-variant
        # Unavailable rather than falsely reporting a figure when the meters
        # do not hold a whole day. Two ways that happens: no completed cycle at
        # all (first day after install, or HA down across the rollover), or a
        # cycle that ran only part of the day -- which is not visible in the
        # meter values themselves, only by comparing them against the inverter's
        # own daily total.
        #
        # Measured 2026-09-06: the meters held 1.18 kWh of import against the
        # inverter's 16 kWh, because they were created at 13:47 the day before.
        # Every yesterday figure derived from them was wrong, and the effective
        # unit rate was inflated by dividing a real cost by a third of a day's
        # energy. A tolerance of 10%, or 1 kWh on a very low-import day.
        #
        # The `inverter == 0` arm keeps these available on a genuine zero-import
        # day rather than treating that as missing data.
        availability: >
          {% set metered = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) %}
          {% set inverter = states('sensor.solis_s6_eh1p_yesterday_energy_imported_from_grid') | float(0) %}
          {% if inverter == 0 %}
            true
          {% else %}
            {{ metered > 0 and (metered - inverter) | abs <= [inverter * 0.1, 1.0] | max }}
          {% endif %}
        state: >
          {% set nb = state_attr('sensor.solar_daily_night_boost', 'last_period') | float(0) * (states('input_number.rate_night_boost') | float(0.1123)) %}
          {% set ni = state_attr('sensor.solar_daily_night', 'last_period') | float(0) * (states('input_number.rate_night') | float(0.2778)) %}
          {% set da = state_attr('sensor.solar_daily_day', 'last_period') | float(0) * (states('input_number.rate_day') | float(0.3578)) %}
          {% set pe = state_attr('sensor.solar_daily_peak', 'last_period') | float(0) * (states('input_number.rate_peak') | float(0.4615)) %}
          {{ (nb + ni + da + pe) | round(2) }}

      # ─── CURRENT PERIOD / RATE ──────────────────────────────────
      # Single source of truth for "which tariff period is it now". Read
      # straight off the select that the utility meters themselves follow,
      # rather than recomputing now().hour a second time — that keeps the
      # boundary logic in exactly one place (the Tariff Period Sync
      # automation below) and makes a stalled sync visible on the dashboard
      # instead of hiding it behind a correct-looking clock.
      - name: "Current Tariff Period"
        unique_id: current_tariff_period
        icon: mdi:clock-outline
        state: "{{ states('select.grid_import_daily') }}"
        attributes:
          # The panel draws a 24-hour tariff ribbon. Rather than reimplement the
          # boundaries in JS -- a fifth copy of logic that has already caused
          # drift bugs here -- the schedule is published as an hour-by-hour map
          # generated from the SAME conditions as the Tariff Period Sync
          # automation below. Change the boundaries in one place and the ribbon,
          # the meters and the accounting all move together.
          #
          # Note this is not a simple start/end table: 19:00-23:00 falls through
          # to `day`, and `night` is split either side of the Night Boost window,
          # so an hour map is the honest representation.
          hours: >
            {% set ns = namespace(out=[]) %}
            {% for h in range(24) %}
              {% if h >= 2 and h < 5 %}{% set ns.out = ns.out + ['night_boost'] %}
              {% elif h >= 17 and h < 19 %}{% set ns.out = ns.out + ['peak'] %}
              {% elif h >= 23 or h < 8 %}{% set ns.out = ns.out + ['night'] %}
              {% else %}{% set ns.out = ns.out + ['day'] %}{% endif %}
            {% endfor %}
            {{ ns.out }}
          rates: >
            {{ {'night_boost': states('input_number.rate_night_boost') | float(0.1123),
                'night': states('input_number.rate_night') | float(0.2778),
                'day': states('input_number.rate_day') | float(0.3578),
                'peak': states('input_number.rate_peak') | float(0.4615)} }}

      # Replaces the hour-based template of the same unique_id in the host's
      # configuration.yaml — that block must be deleted there, see README.
      # `availability` deliberately makes an unsynced select surface as
      # unavailable rather than silently reporting the day rate.
      - name: "Electricity Rate"
        unique_id: electricity_rate_yaml
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >
          {{ states('sensor.current_tariff_period') in ['night_boost', 'night', 'day', 'peak'] }}
        state: >
          {% set rates = {'night_boost': states('input_number.rate_night_boost') | float(0.1123), 'night': states('input_number.rate_night') | float(0.2778), 'day': states('input_number.rate_day') | float(0.3578), 'peak': states('input_number.rate_peak') | float(0.4615)} %}
          {{ rates[states('sensor.current_tariff_period')] }}

      # ─── SOLAR TODAY (UNAMBIGUOUS kWh) ──────────────────────────
      # Summed from the four solar_daily_* tariff buckets, whose source is
      # the confirmed-kWh sensor.solar_total_yield. The four selects are
      # always switched together by Tariff Period Sync, so the buckets
      # partition the day without overlap and this sum is today's total.
      # Exists so no consumer has to remember the sensor.solar_today Wh
      # gotcha — there is deliberately no /1000 anywhere in this chain.
      - name: "Solar Today kWh"
        unique_id: solar_today_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ (states('sensor.solar_daily_night_boost') | float(0)
            + states('sensor.solar_daily_night') | float(0)
            + states('sensor.solar_daily_day') | float(0)
            + states('sensor.solar_daily_peak') | float(0)) | round(2) }}

      # Replaces the sensor.solar_today-based template of the same unique_id
      # in the host's configuration.yaml — that block must be deleted there.
      # sensor.total_energy_saving folds this into the lifetime accumulator,
      # so sourcing it from the unambiguous sensor above keeps a unit error
      # from becoming permanent.
      - name: "Solar Value Today"
        unique_id: solar_value_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {{ (states('sensor.solar_today_kwh') | float(0) * states('input_number.rate_day') | float(0.3578)) | round(2) }}

automation:
  - alias: "Tariff Period Sync"
    id: tariff_period_sync
    trigger:
      - platform: time
        at: "02:00:00"
      - platform: time
        at: "05:00:00"
      - platform: time
        at: "08:00:00"
      - platform: time
        at: "17:00:00"
      - platform: time
        at: "19:00:00"
      - platform: time
        at: "23:00:00"
      - platform: homeassistant
        event: start
      # Self-healing: if an exact-boundary trigger is missed (DST, clock
      # skew, brief HA unavailability), this re-fires the idempotent
      # select.select_option every 15 min so the period self-corrects
      # within 15 minutes instead of staying wrong until the next boundary.
      - platform: time_pattern
        minutes: "/15"
    action:
      - variables:
          period: >
            {% set hour = now().hour %}
            {% if hour >= 2 and hour < 5 %}
              night_boost
            {% elif hour >= 17 and hour < 19 %}
              peak
            {% elif hour >= 23 or hour < 8 %}
              night
            {% else %}
              day
            {% endif %}
      - service: select.select_option
        target:
          entity_id:
            - select.grid_import_daily
            - select.battery_charge_daily
            - select.battery_discharge_daily
            - select.solar_daily
        data:
          option: "{{ period }}"

  - alias: "Tariff Period Savings Midnight Rollup"
    id: tariff_period_savings_midnight_rollup
    trigger:
      # 23:59:59, as close to the 00:00:00 utility_meter daily reset as
      # possible, to shrink (but not eliminate) the race between this
      # read-then-write rollup and the meter resetting — a known, accepted
      # small edge case, not something this fix fully solves.
      - platform: time
        at: "23:59:59"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_night_boost
        data:
          value: "{{ (states('input_number.total_saving_night_boost') | float(0) + states('sensor.saving_today_night_boost') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_night
        data:
          value: "{{ (states('input_number.total_saving_night') | float(0) + states('sensor.saving_today_night') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_day
        data:
          value: "{{ (states('input_number.total_saving_day') | float(0) + states('sensor.saving_today_day') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_peak
        data:
          value: "{{ (states('input_number.total_saving_peak') | float(0) + states('sensor.saving_today_peak') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_night_boost
        data:
          value: "{{ (states('input_number.total_arbitrage_night_boost') | float(0) + states('sensor.arbitrage_today_night_boost') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_night
        data:
          value: "{{ (states('input_number.total_arbitrage_night') | float(0) + states('sensor.arbitrage_today_night') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_day
        data:
          value: "{{ (states('input_number.total_arbitrage_day') | float(0) + states('sensor.arbitrage_today_day') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_peak
        data:
          value: "{{ (states('input_number.total_arbitrage_peak') | float(0) + states('sensor.arbitrage_today_peak') | float(0)) | round(2) }}"

  # One message a day beats three alert conditions, which get muted. Fires after
  # the meters have rolled over, so every yesterday figure is settled.
  #
  # Target: notify.mobile_app_macphone. The companion app creates one service per
  # registered device; `notify.notify` would reach every device on the account,
  # including other people's. Change the service below to retarget.
  - alias: "Energy Morning Report"
    id: energy_morning_report
    trigger:
      - platform: time
        at: "07:30:00"
    action:
      - variables:
          saving: "{{ states('sensor.energy_saving_yesterday') }}"
          # The yesterday sensors go unavailable when the meters did not cover a
          # whole day. Saying so is more use than printing "unavailable".
          settled: "{{ saving not in ['unknown', 'unavailable', 'none'] }}"
          rate: "{{ states('sensor.effective_unit_rate_yesterday') }}"
          day_rate: "{{ states('input_number.rate_day') | float(0) }}"
          charged: "{{ states('sensor.solis_s6_eh1p_yesterday_battery_charge_energy') | float(0) }}"
          discharged: "{{ states('sensor.solis_s6_eh1p_yesterday_battery_discharge_energy') | float(0) }}"
          solar: "{{ states('sensor.solar_yesterday_kwh') }}"
          drift: "{{ states('sensor.tariff_meter_drift_yesterday') | float(0) }}"
      - service: notify.mobile_app_macphone
        data:
          title: >
            {% if settled %}
              Yesterday you saved €{{ saving }}
            {% else %}
              Yesterday's figures are incomplete
            {% endif %}
          message: >
            {%- if settled -%}
            €{{ rate }}/kWh all-in, against a €{{ '%.4f' % day_rate }} day rate.
            Battery {{ '%.1f' % charged }} kWh in, {{ '%.1f' % discharged }} out{% if solar not in ['unknown','unavailable','none'] %}, solar {{ solar }} kWh{% endif %}.
            Lifetime €{{ states('sensor.total_energy_saving') }} over {{ states('sensor.days_since_install') }} days, payback {{ states('sensor.payback_years_remaining') }} yr.
            {%- if drift | abs > 1.0 %}
            ⚠ Meters are {{ '%.1f' % (drift | abs) }} kWh short of the inverter's own total, so these figures undercount.
            {%- endif -%}
            {%- else -%}
            The tariff meters did not cover a whole day{% if drift | abs > 1.0 %} — they are {{ '%.1f' % (drift | abs) }} kWh short of the inverter's total{% endif %}.
            Nothing is broken; the figures return once a full day completes.
            {%- endif -%}
          data:
            # Replaces yesterday's report rather than stacking a new one each day.
            tag: energy-morning-report
            channel: Energy
            url: /energy-dashboard


panel_custom:
  - name: energy-dashboard
    sidebar_title: Energy
    sidebar_icon: mdi:lightning-bolt
    url_path: energy-dashboard
    # BUMP THIS ON EVERY RELEASE to match the version installed via HACS, and
    # UPDATE HACS FIRST, then copy this file.
    #
    # Why this query string exists: this host sits behind Nginx Proxy Manager
    # (server: openresty) with "Cache Assets" enabled on the proxy host. That
    # caches static assets keyed on the FULL URL including the query, with a
    # long expiry -- and it caches 404s as well as hits.
    #
    # Two failures traced to it, both of which looked like panel bugs:
    #   * a stale build served for hours after a HACS update, across restarts
    #     and browser hard-refreshes, because a refresh cannot clear a proxy
    #     cache;
    #   * "Unable to load custom panel" on 2026-09-06, when this file was copied
    #     before HACS had downloaded the release. HA requested a URL that did
    #     not exist yet, the 404 was cached, and the panel kept failing after
    #     the file arrived. ?v=0.9.2 returned 404 while ?cb=<random> returned
    #     the correct 54798-byte file from the same path.
    #
    # THE REAL FIX is to turn off "Cache Assets" for this proxy host in Nginx
    # Proxy Manager (Hosts -> Proxy Hosts -> edit -> Cache Assets off). HA sets
    # its own cache headers correctly and does not need the proxy to do it.
    # With that off, this query string can be dropped entirely.
    #
    # If a URL does get poisoned, bump this to a value never requested. Entries
    # also expire on their own within about a day.
    module_url: /hacsfiles/HA-App/energy-dashboard.js?v=0.9.5