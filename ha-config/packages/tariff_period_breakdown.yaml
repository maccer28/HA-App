      # ─── TRUE HOUSEHOLD CONSUMPTION ─────────────────────────────
      # sensor.solis_s6_eh1p_household_load_* cannot be used for this. Measured
      # over a 10-day holiday in Aug 2026, with nobody home, it was wrong twice
      # over:
      #
      #   * It counts battery charging as household load. At 02:00 it reported
      #     1536 W while the battery was drawing 4937 W, inflating the metered
      #     daily figure by about 1.7 kWh on every charging day.
      #   * It cannot see the AC-coupled solar, which is on a separate inverter,
      #     so through the middle of the day it reports load NET of solar. The
      #     raw profile bottomed out at 13:00 -- not less use, just solar
      #     covering it.
      #
      # This derives consumption from metered flows instead: what the battery
      # and solar delivered, plus what the grid delivered that did not go into
      # the battery. Clamped at zero, since a period can import purely to charge.
      - name: "House Energy Today"
        unique_id: house_energy_today
