# ha-config/packages/tariff_period_breakdown.yaml
#
# RATES: taken from the 29/07/2026-28/08/2026 bill and stated INCLUSIVE OF 9%
# VAT, because that is what the money actually costs. The bill lists rates
# ex-VAT and adds VAT at the end, so each figure here is the billed rate x 1.09:
#
#   EV / Night Boost  0.1030 -> 0.1123
#   Night             0.2549 -> 0.2778
#   Day               0.3283 -> 0.3578
#   Peak              0.4234 -> 0.4615
#
# The daily fixed charge of 1.1120 is the standing charge (0.9731 -> 1.0607)
# plus the PSO levy (1.46/month -> 0.0513/day). Both are unavoidable, and
# together they are about 40% of the bill, which is why the dashboard surfaces
# standing charge share rather than hiding it inside the cost.
#
# Band windows are confirmed against a supplier bill's own Timeband table:
#   Day    "All other times"   (so 08:00-17:00 AND 19:00-23:00)
#   Night  "11pm-8am"
#   Peak   "5pm-7pm"
# matching the hour map published by sensor.current_tariff_period exactly. The
# EV / Night Boost window (02:00-05:00) sits inside Night and is not itemised on
# that bill; it is confirmed by the account holder. The Tariff Period Sync automation below is the single place
# they are defined; sensor.current_tariff_period republishes them as an hour map
# for the panel's ribbon.
#
# Rates rose on 20/07/2026. If they change again, they must be updated in every
# template below -- they are deliberately literal rather than indirected through
# helpers, but that means a change touches many lines. Search for the old value.
#
# Tariff-period financial breakdown. See:
# docs/superpowers/specs/2026-09-04-tariff-period-financial-breakdown-design.md
# in the HA-App repo for the full design.
#
# One-time setup on the HA host, if not already done:
#   Add `packages: !include_dir_named packages` under the `homeassistant:`
#   key in configuration.yaml, then place this file in `config/packages/`.

# Sources are the inverter's `today_*` counters, not its `total_*` ones. The
# total_* counters are integers stepping in whole kWh, which caused two real
# problems (both observed live on 2026-09-05):
#
#   1. A utility_meter produces nothing until its source changes, so after a
#      restart these meters sat at `unknown` for hours and
#      sensor.energy_cost_today collapsed to just the standing charge.
#   2. Each 1 kWh tick is attributed entirely to whichever tariff was active
#      when the counter crossed. At the Night Boost/Night boundary the rates
#      differ 3x, so the split feeding every downstream figure was coarse.
#
# The today_* counters are 0.1 kWh and tick ~150x/day, fixing both. They reset
# daily, which is safe here: utility_meter ignores a negative delta (treating
# it as a source rollover) and these meters reset on the same midnight, so the
# two resets align instead of double-counting.
#
# solar_daily deliberately keeps a total_* style source — sensor.solar_total_yield
# already has 2 dp and updates constantly, and the only daily solar alternative
# is the Wh-denominated sensor.solar_today helper.
utility_meter:
  grid_import_daily:
    source: sensor.solis_s6_eh1p_meter_total_active_energy_from_grid
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

  battery_charge_daily:
    source: sensor.solis_s6_eh1p_today_battery_charge_energy
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

  battery_discharge_daily:
    source: sensor.solis_s6_eh1p_today_battery_discharge_energy
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

  # sensor.solar_total_yield is confirmed genuinely kWh: the unit is declared
  # directly on its Modbus input register in the host's configuration.yaml
  # (slave 1, address 72, unit_of_measurement "kWh"). It is a different sensor
  # from sensor.solar_today, which is a UI helper and carries the Wh/kWh
  # ambiguity noted in CLAUDE.md — everything downstream of this meter is free
  # of that ambiguity, which is why sensor.solar_today_kwh below is derived
  # from these tariff buckets rather than from sensor.solar_today.
  solar_daily:
    source: sensor.solar_total_yield
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

input_number:
  # Tariff rates, VAT-inclusive. Held as helpers so a price change is four edits
  # in the HA UI rather than a find-and-replace across ~70 template lines, where
  # a half-finished edit would be a silent drift bug. Every template reads these
  # with the current value as its float() default, so the package still computes
  # correctly if a helper is ever missing.
  rate_night_boost:
    name: "Rate - Night Boost (EV)"
    initial: 0.1123
    min: 0
    max: 5
    step: 0.0001
    unit_of_measurement: "EUR/kWh"
    mode: box
  rate_night:
    name: "Rate - Night"
    initial: 0.2778
    min: 0
    max: 5
    step: 0.0001
    unit_of_measurement: "EUR/kWh"
    mode: box
  rate_day:
    name: "Rate - Day"
    initial: 0.3578
    min: 0
    max: 5
    step: 0.0001
    unit_of_measurement: "EUR/kWh"
    mode: box
  rate_peak:
    name: "Rate - Peak"
    initial: 0.4615
    min: 0
    max: 5
    step: 0.0001
    unit_of_measurement: "EUR/kWh"
    mode: box
  daily_fixed_charge:
    name: "Daily Fixed Charge"
    # standing charge 1.0607 + PSO levy 0.0513
    initial: 1.1120
    min: 0
    max: 50
    step: 0.0001
    unit_of_measurement: "EUR"
    mode: box

  total_saving_night_boost:
    name: "Total Saving - Night Boost"
    initial: 0
    # Negative: a period can legitimately have net-negative saving (Night Boost
    # is pure spend -- energy goes IN, none comes out). Clamping at 0 would
    # silently discard the cost side of the arbitrage, same bug as the
    # total_arbitrage_* helpers had.
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_saving_night:
    name: "Total Saving - Night"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_saving_day:
    name: "Total Saving - Day"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_saving_peak:
    name: "Total Saving - Peak"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_night_boost:
    name: "Total Arbitrage - Night Boost"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_night:
    name: "Total Arbitrage - Night"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_day:
    name: "Total Arbitrage - Day"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  # Site facts used by the performance sensors. Kept as helpers rather than
  # hardcoded so they can be corrected without editing this file.
  system_cost:
    name: "System Cost"
    initial: 3500
    min: 0
    max: 1000000
    step: 1
    unit_of_measurement: "EUR"
    mode: box
  battery_capacity_kwh:
    name: "Battery Usable Capacity"
    # Lithtech TR8500WX: 51.2V x 314Ah = 16.076 kWh. Used ONLY to turn lifetime
    # charge energy into equivalent full cycles; nothing else depends on it.
    #
    # Do not confuse this with number.solis_s6_eh1p_battery_rated_capacity,
    # which sits at 50 Ah on the inverter. That field is dead config: it applies
    # only to batteries without BMS communication. This pack reports SOC to the
    # inverter over RS485, so the inverter uses the BMS figures and ignores it.
    # Leave it alone.
    initial: 16.076
    min: 0.1
    max: 1000
    step: 0.001
    unit_of_measurement: "kWh"
    mode: box

  total_arbitrage_peak:
    name: "Total Arbitrage - Peak"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box

template:
  - sensor:
      # ─── PER-PERIOD SAVING (TODAY) ──────────────────────────────
      - name: "Saving Today - Night Boost"
        unique_id: saving_today_night_boost
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # NET saving for this period: what the discharged + solar energy saved
        # at this period's rate, MINUS what was paid to put energy into the
        # battery during this period. The charge term matters enormously for a
        # charge-cheap/use-later setup: omitting it inflated the daily figure
        # by the whole charge cost (measured 2026-09-05: EUR 3.31 reported vs
        # EUR 2.11 actual). Expect this to be negative during Night Boost
        # (charging) and positive during Day/Peak (discharging) -- the two
        # sides are the arbitrage spread, and they net out across the day.
        state: >
          {% set rate = states('input_number.rate_night_boost') | float(0.1123) %}
          {% set charged = states('sensor.battery_charge_daily_night_boost') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night_boost') | float(0) %}
          {% set solar = states('sensor.solar_daily_night_boost') | float(0) %}
          {{ ((discharged + solar - charged) * rate) | round(2) }}

      - name: "Saving Today - Night"
        unique_id: saving_today_night
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # NET saving for this period: what the discharged + solar energy saved
        # at this period's rate, MINUS what was paid to put energy into the
        # battery during this period. The charge term matters enormously for a
        # charge-cheap/use-later setup: omitting it inflated the daily figure
        # by the whole charge cost (measured 2026-09-05: EUR 3.31 reported vs
        # EUR 2.11 actual). Expect this to be negative during Night Boost
        # (charging) and positive during Day/Peak (discharging) -- the two
        # sides are the arbitrage spread, and they net out across the day.
        state: >
          {% set rate = states('input_number.rate_night') | float(0.2778) %}
          {% set charged = states('sensor.battery_charge_daily_night') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night') | float(0) %}
          {% set solar = states('sensor.solar_daily_night') | float(0) %}
          {{ ((discharged + solar - charged) * rate) | round(2) }}

      - name: "Saving Today - Day"
        unique_id: saving_today_day
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # NET saving for this period: what the discharged + solar energy saved
        # at this period's rate, MINUS what was paid to put energy into the
        # battery during this period. The charge term matters enormously for a
        # charge-cheap/use-later setup: omitting it inflated the daily figure
        # by the whole charge cost (measured 2026-09-05: EUR 3.31 reported vs
        # EUR 2.11 actual). Expect this to be negative during Night Boost
        # (charging) and positive during Day/Peak (discharging) -- the two
        # sides are the arbitrage spread, and they net out across the day.
        state: >
          {% set rate = states('input_number.rate_day') | float(0.3578) %}
          {% set charged = states('sensor.battery_charge_daily_day') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_day') | float(0) %}
          {% set solar = states('sensor.solar_daily_day') | float(0) %}
          {{ ((discharged + solar - charged) * rate) | round(2) }}

      - name: "Saving Today - Peak"
        unique_id: saving_today_peak
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # NET saving for this period: what the discharged + solar energy saved
        # at this period's rate, MINUS what was paid to put energy into the
        # battery during this period. The charge term matters enormously for a
        # charge-cheap/use-later setup: omitting it inflated the daily figure
        # by the whole charge cost (measured 2026-09-05: EUR 3.31 reported vs
        # EUR 2.11 actual). Expect this to be negative during Night Boost
        # (charging) and positive during Day/Peak (discharging) -- the two
        # sides are the arbitrage spread, and they net out across the day.
        state: >
          {% set rate = states('input_number.rate_peak') | float(0.4615) %}
          {% set charged = states('sensor.battery_charge_daily_peak') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_peak') | float(0) %}
          {% set solar = states('sensor.solar_daily_peak') | float(0) %}
          {{ ((discharged + solar - charged) * rate) | round(2) }}

      # ─── PER-PERIOD ARBITRAGE (TODAY) ───────────────────────────
      - name: "Arbitrage Today - Night Boost"
        unique_id: arbitrage_today_night_boost
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = states('input_number.rate_night_boost') | float(0.1123) %}
          {% set charged = states('sensor.battery_charge_daily_night_boost') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night_boost') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      - name: "Arbitrage Today - Night"
        unique_id: arbitrage_today_night
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = states('input_number.rate_night') | float(0.2778) %}
          {% set charged = states('sensor.battery_charge_daily_night') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      - name: "Arbitrage Today - Day"
        unique_id: arbitrage_today_day
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = states('input_number.rate_day') | float(0.3578) %}
          {% set charged = states('sensor.battery_charge_daily_day') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_day') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      - name: "Arbitrage Today - Peak"
        unique_id: arbitrage_today_peak
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = states('input_number.rate_peak') | float(0.4615) %}
          {% set charged = states('sensor.battery_charge_daily_peak') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_peak') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      # ─── PER-PERIOD LIFETIME TOTALS ─────────────────────────────
      - name: "Total Saving - Night Boost"
        unique_id: total_saving_night_boost
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_night_boost') | float(0) + states('sensor.saving_today_night_boost') | float(0)) | round(2) }}

      - name: "Total Saving - Night"
        unique_id: total_saving_night
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_night') | float(0) + states('sensor.saving_today_night') | float(0)) | round(2) }}

      - name: "Total Saving - Day"
        unique_id: total_saving_day
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_day') | float(0) + states('sensor.saving_today_day') | float(0)) | round(2) }}

      - name: "Total Saving - Peak"
        unique_id: total_saving_peak
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_peak') | float(0) + states('sensor.saving_today_peak') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Night Boost"
        unique_id: total_arbitrage_night_boost
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_night_boost') | float(0) + states('sensor.arbitrage_today_night_boost') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Night"
        unique_id: total_arbitrage_night
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_night') | float(0) + states('sensor.arbitrage_today_night') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Day"
        unique_id: total_arbitrage_day
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_day') | float(0) + states('sensor.arbitrage_today_day') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Peak"
        unique_id: total_arbitrage_peak
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_peak') | float(0) + states('sensor.arbitrage_today_peak') | float(0)) | round(2) }}

      # ─── REWRITTEN DAILY COST SENSORS (accurate per-period sums,
      #     replacing the old flat 3kWh/10%-heuristic split) ───────
      - name: "Energy Cost Today"
        unique_id: energy_cost_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        state: >
          {% set standing = states('input_number.daily_fixed_charge') | float(1.1120) %}
          {% set nb = states('sensor.grid_import_daily_night_boost') | float(0) * states('input_number.rate_night_boost') | float(0.1123) %}
          {% set n  = states('sensor.grid_import_daily_night') | float(0) * states('input_number.rate_night') | float(0.2778) %}
          {% set d  = states('sensor.grid_import_daily_day') | float(0) * states('input_number.rate_day') | float(0.3578) %}
          {% set p  = states('sensor.grid_import_daily_peak') | float(0) * states('input_number.rate_peak') | float(0.4615) %}
          {{ (nb + n + d + p + standing) | round(2) }}

      - name: "Energy Cost Without Battery Today"
        unique_id: energy_cost_without_battery_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        state: >
          {% set standing = states('input_number.daily_fixed_charge') | float(1.1120) %}
          {% set nb = (states('sensor.grid_import_daily_night_boost') | float(0) - states('sensor.battery_charge_daily_night_boost') | float(0) + states('sensor.battery_discharge_daily_night_boost') | float(0) + states('sensor.solar_daily_night_boost') | float(0)) * states('input_number.rate_night_boost') | float(0.1123) %}
          {% set n  = (states('sensor.grid_import_daily_night') | float(0) - states('sensor.battery_charge_daily_night') | float(0) + states('sensor.battery_discharge_daily_night') | float(0) + states('sensor.solar_daily_night') | float(0)) * states('input_number.rate_night') | float(0.2778) %}
          {% set d  = (states('sensor.grid_import_daily_day') | float(0) - states('sensor.battery_charge_daily_day') | float(0) + states('sensor.battery_discharge_daily_day') | float(0) + states('sensor.solar_daily_day') | float(0)) * states('input_number.rate_day') | float(0.3578) %}
          {% set p  = (states('sensor.grid_import_daily_peak') | float(0) - states('sensor.battery_charge_daily_peak') | float(0) + states('sensor.battery_discharge_daily_peak') | float(0) + states('sensor.solar_daily_peak') | float(0)) * states('input_number.rate_peak') | float(0.4615) %}
          {{ (nb + n + d + p + standing) | round(2) }}

      # ─── TODAY AGGREGATES (per-period, replacing flat-rate guesses) ──
      # The host's versions assumed every kWh charged went in at the night
      # boost rate and every kWh discharged came out at the day rate. Without
      # these the package would leave today LESS accurate than yesterday.
      - name: "Battery Charge Cost Today"
        unique_id: battery_charge_cost_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:battery-charging
        state: >
          {% set nb = states('sensor.battery_charge_daily_night_boost') | float(0) * states('input_number.rate_night_boost') | float(0.1123) %}
          {% set n  = states('sensor.battery_charge_daily_night') | float(0) * states('input_number.rate_night') | float(0.2778) %}
          {% set d  = states('sensor.battery_charge_daily_day') | float(0) * states('input_number.rate_day') | float(0.3578) %}
          {% set p  = states('sensor.battery_charge_daily_peak') | float(0) * states('input_number.rate_peak') | float(0.4615) %}
          {{ (nb + n + d + p) | round(2) }}

      - name: "Arbitrage Profit Today"
        unique_id: arbitrage_profit_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {{ (states('sensor.arbitrage_today_night_boost') | float(0)
            + states('sensor.arbitrage_today_night') | float(0)
            + states('sensor.arbitrage_today_day') | float(0)
            + states('sensor.arbitrage_today_peak') | float(0)) | round(2) }}

      # Solar is ALREADY inside energy_saving_today: the accurate
      # energy_cost_without_battery_today prices (import + discharge + solar)
      # while energy_cost_today prices import alone, so their difference is
      # (discharge + solar) * rate. The host's version added
      # sensor.solar_value_today on top of that, counting solar twice. That was
      # harmless while the old cost sensors excluded solar, but it becomes a
      # real double-count with the accurate ones — hence this override.
      #
      # The host's "Add Daily Saving at Midnight" automation has the SAME bug
      # (it adds sensor.solar_value_yesterday to input_number.total_energy_savings)
      # and must be fixed too — see README. It has been harmless only because
      # solar_value_yesterday read 0 from a non-existent entity; once that
      # sensor returns real numbers the error starts accumulating permanently.
      - name: "Total Energy Saving"
        unique_id: total_energy_saving
        unit_of_measurement: "EUR"
        state_class: total_increasing
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_energy_savings') | float(0)
            + states('sensor.energy_saving_today') | float(0)) | round(2) }}

      # ─── YESTERDAY (from utility_meter `last_period`) ───────────
      # Every utility_meter tariff sensor stores its previous completed cycle
      # in a `last_period` attribute (a stringified Decimal, hence the
      # | float(0)), and each tariff sensor keeps its own independently. The
      # meters here are cycle: daily, so `last_period` *is* yesterday —
      # available directly, with no history query and no recorder dependency,
      # and restored across HA restarts.
      #
      # This replaces the heuristics in the host's configuration.yaml, which
      # had only a single daily total to work from and so guessed the tariff
      # split (min(imported, 3.0) as night boost, 10% of the remainder as
      # peak, all battery charging at the night boost rate). Yesterday is now
      # computed exactly like today.
      #
      # It also removes the last consumer of
      # sensor.solar_today_previous_period, retiring the sensor.solar_today
      # Wh/kWh ambiguity entirely rather than working around it.
      #
      # Note: these read 0 until the first midnight after this package is
      # installed, because no cycle has completed yet. They self-correct
      # after one night.
      #
      # sensor.energy_saving_yesterday is deliberately NOT redefined here —
      # it derives purely from the two cost sensors below, so the existing
      # definition in configuration.yaml keeps working untouched.
      - name: "Energy Cost Yesterday"
        unique_id: energy_cost_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        # Unavailable rather than falsely reporting a figure when the meters
        # do not hold a whole day. Two ways that happens: no completed cycle at
        # all (first day after install, or HA down across the rollover), or a
        # cycle that ran only part of the day -- which is not visible in the
        # meter values themselves, only by comparing them against the inverter's
        # own daily total.
        #
        # Measured 2026-09-06: the meters held 1.18 kWh of import against the
