# ha-config/packages/tariff_period_breakdown.yaml
#
# Tariff-period financial breakdown. See:
# docs/superpowers/specs/2026-09-04-tariff-period-financial-breakdown-design.md
# in the HA-App repo for the full design.
#
# One-time setup on the HA host, if not already done:
#   Add `packages: !include_dir_named packages` under the `homeassistant:`
#   key in configuration.yaml, then place this file in `config/packages/`.

# Sources are the inverter's `today_*` counters, not its `total_*` ones. The
# total_* counters are integers stepping in whole kWh, which caused two real
# problems (both observed live on 2026-09-05):
#
#   1. A utility_meter produces nothing until its source changes, so after a
#      restart these meters sat at `unknown` for hours and
#      sensor.energy_cost_today collapsed to just the standing charge.
#   2. Each 1 kWh tick is attributed entirely to whichever tariff was active
#      when the counter crossed. At the Night Boost/Night boundary the rates
#      differ 3x, so the split feeding every downstream figure was coarse.
#
# The today_* counters are 0.1 kWh and tick ~150x/day, fixing both. They reset
# daily, which is safe here: utility_meter ignores a negative delta (treating
# it as a source rollover) and these meters reset on the same midnight, so the
# two resets align instead of double-counting.
#
# solar_daily deliberately keeps a total_* style source — sensor.solar_total_yield
# already has 2 dp and updates constantly, and the only daily solar alternative
# is the Wh-denominated sensor.solar_today helper.
utility_meter:
  grid_import_daily:
    source: sensor.solis_s6_eh1p_today_energy_imported_from_grid
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

  battery_charge_daily:
    source: sensor.solis_s6_eh1p_today_battery_charge_energy
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

  battery_discharge_daily:
    source: sensor.solis_s6_eh1p_today_battery_discharge_energy
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

  # sensor.solar_total_yield is confirmed genuinely kWh: the unit is declared
  # directly on its Modbus input register in the host's configuration.yaml
  # (slave 1, address 72, unit_of_measurement "kWh"). It is a different sensor
  # from sensor.solar_today, which is a UI helper and carries the Wh/kWh
  # ambiguity noted in CLAUDE.md — everything downstream of this meter is free
  # of that ambiguity, which is why sensor.solar_today_kwh below is derived
  # from these tariff buckets rather than from sensor.solar_today.
  solar_daily:
    source: sensor.solar_total_yield
    cycle: daily
    tariffs:
      - night_boost
      - night
      - day
      - peak

input_number:
  total_saving_night_boost:
    name: "Total Saving - Night Boost"
    initial: 0
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_saving_night:
    name: "Total Saving - Night"
    initial: 0
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_saving_day:
    name: "Total Saving - Day"
    initial: 0
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_saving_peak:
    name: "Total Saving - Peak"
    initial: 0
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_night_boost:
    name: "Total Arbitrage - Night Boost"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_night:
    name: "Total Arbitrage - Night"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_day:
    name: "Total Arbitrage - Day"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box
  total_arbitrage_peak:
    name: "Total Arbitrage - Peak"
    initial: 0
    min: -100000
    max: 100000
    step: 0.01
    unit_of_measurement: "EUR"
    mode: box

template:
  - sensor:
      # ─── PER-PERIOD SAVING (TODAY) ──────────────────────────────
      - name: "Saving Today - Night Boost"
        unique_id: saving_today_night_boost
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # Algebraically cost_without - cost_with reduces to
        # (discharged + solar) * rate (the imported term cancels); the
        # long form is kept deliberately to make the "vs. no battery"
        # derivation explicit, not because `imported` is needed for the
        # final result.
        state: >
          {% set rate = 0.0824 %}
          {% set imported = states('sensor.grid_import_daily_night_boost') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night_boost') | float(0) %}
          {% set solar = states('sensor.solar_daily_night_boost') | float(0) %}
          {% set cost_with = imported * rate %}
          {% set cost_without = (imported + discharged + solar) * rate %}
          {{ (cost_without - cost_with) | round(2) }}

      - name: "Saving Today - Night"
        unique_id: saving_today_night
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # Algebraically cost_without - cost_with reduces to
        # (discharged + solar) * rate (the imported term cancels); the
        # long form is kept deliberately to make the "vs. no battery"
        # derivation explicit, not because `imported` is needed for the
        # final result.
        state: >
          {% set rate = 0.2438 %}
          {% set imported = states('sensor.grid_import_daily_night') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night') | float(0) %}
          {% set solar = states('sensor.solar_daily_night') | float(0) %}
          {% set cost_with = imported * rate %}
          {% set cost_without = (imported + discharged + solar) * rate %}
          {{ (cost_without - cost_with) | round(2) }}

      - name: "Saving Today - Day"
        unique_id: saving_today_day
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # Algebraically cost_without - cost_with reduces to
        # (discharged + solar) * rate (the imported term cancels); the
        # long form is kept deliberately to make the "vs. no battery"
        # derivation explicit, not because `imported` is needed for the
        # final result.
        state: >
          {% set rate = 0.3233 %}
          {% set imported = states('sensor.grid_import_daily_day') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_day') | float(0) %}
          {% set solar = states('sensor.solar_daily_day') | float(0) %}
          {% set cost_with = imported * rate %}
          {% set cost_without = (imported + discharged + solar) * rate %}
          {{ (cost_without - cost_with) | round(2) }}

      - name: "Saving Today - Peak"
        unique_id: saving_today_peak
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:piggy-bank
        # Algebraically cost_without - cost_with reduces to
        # (discharged + solar) * rate (the imported term cancels); the
        # long form is kept deliberately to make the "vs. no battery"
        # derivation explicit, not because `imported` is needed for the
        # final result.
        state: >
          {% set rate = 0.4508 %}
          {% set imported = states('sensor.grid_import_daily_peak') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_peak') | float(0) %}
          {% set solar = states('sensor.solar_daily_peak') | float(0) %}
          {% set cost_with = imported * rate %}
          {% set cost_without = (imported + discharged + solar) * rate %}
          {{ (cost_without - cost_with) | round(2) }}

      # ─── PER-PERIOD ARBITRAGE (TODAY) ───────────────────────────
      - name: "Arbitrage Today - Night Boost"
        unique_id: arbitrage_today_night_boost
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = 0.0824 %}
          {% set charged = states('sensor.battery_charge_daily_night_boost') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night_boost') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      - name: "Arbitrage Today - Night"
        unique_id: arbitrage_today_night
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = 0.2438 %}
          {% set charged = states('sensor.battery_charge_daily_night') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_night') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      - name: "Arbitrage Today - Day"
        unique_id: arbitrage_today_day
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = 0.3233 %}
          {% set charged = states('sensor.battery_charge_daily_day') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_day') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      - name: "Arbitrage Today - Peak"
        unique_id: arbitrage_today_peak
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set rate = 0.4508 %}
          {% set charged = states('sensor.battery_charge_daily_peak') | float(0) %}
          {% set discharged = states('sensor.battery_discharge_daily_peak') | float(0) %}
          {{ ((discharged * rate) - (charged * rate)) | round(2) }}

      # ─── PER-PERIOD LIFETIME TOTALS ─────────────────────────────
      - name: "Total Saving - Night Boost"
        unique_id: total_saving_night_boost
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_night_boost') | float(0) + states('sensor.saving_today_night_boost') | float(0)) | round(2) }}

      - name: "Total Saving - Night"
        unique_id: total_saving_night
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_night') | float(0) + states('sensor.saving_today_night') | float(0)) | round(2) }}

      - name: "Total Saving - Day"
        unique_id: total_saving_day
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_day') | float(0) + states('sensor.saving_today_day') | float(0)) | round(2) }}

      - name: "Total Saving - Peak"
        unique_id: total_saving_peak
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_saving_peak') | float(0) + states('sensor.saving_today_peak') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Night Boost"
        unique_id: total_arbitrage_night_boost
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_night_boost') | float(0) + states('sensor.arbitrage_today_night_boost') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Night"
        unique_id: total_arbitrage_night
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_night') | float(0) + states('sensor.arbitrage_today_night') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Day"
        unique_id: total_arbitrage_day
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_day') | float(0) + states('sensor.arbitrage_today_day') | float(0)) | round(2) }}

      - name: "Total Arbitrage - Peak"
        unique_id: total_arbitrage_peak
        unit_of_measurement: "EUR"
        state_class: total
        icon: mdi:trending-up
        state: >
          {{ (states('input_number.total_arbitrage_peak') | float(0) + states('sensor.arbitrage_today_peak') | float(0)) | round(2) }}

      # ─── REWRITTEN DAILY COST SENSORS (accurate per-period sums,
      #     replacing the old flat 3kWh/10%-heuristic split) ───────
      - name: "Energy Cost Today"
        unique_id: energy_cost_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        state: >
          {% set standing = 0.9164 %}
          {% set nb = states('sensor.grid_import_daily_night_boost') | float(0) * 0.0824 %}
          {% set n  = states('sensor.grid_import_daily_night') | float(0) * 0.2438 %}
          {% set d  = states('sensor.grid_import_daily_day') | float(0) * 0.3233 %}
          {% set p  = states('sensor.grid_import_daily_peak') | float(0) * 0.4508 %}
          {{ (nb + n + d + p + standing) | round(2) }}

      - name: "Energy Cost Without Battery Today"
        unique_id: energy_cost_without_battery_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        state: >
          {% set standing = 0.9164 %}
          {% set nb = (states('sensor.grid_import_daily_night_boost') | float(0) + states('sensor.battery_discharge_daily_night_boost') | float(0) + states('sensor.solar_daily_night_boost') | float(0)) * 0.0824 %}
          {% set n  = (states('sensor.grid_import_daily_night') | float(0) + states('sensor.battery_discharge_daily_night') | float(0) + states('sensor.solar_daily_night') | float(0)) * 0.2438 %}
          {% set d  = (states('sensor.grid_import_daily_day') | float(0) + states('sensor.battery_discharge_daily_day') | float(0) + states('sensor.solar_daily_day') | float(0)) * 0.3233 %}
          {% set p  = (states('sensor.grid_import_daily_peak') | float(0) + states('sensor.battery_discharge_daily_peak') | float(0) + states('sensor.solar_daily_peak') | float(0)) * 0.4508 %}
          {{ (nb + n + d + p + standing) | round(2) }}

      # ─── TODAY AGGREGATES (per-period, replacing flat-rate guesses) ──
      # The host's versions assumed every kWh charged went in at the night
      # boost rate and every kWh discharged came out at the day rate. Without
      # these the package would leave today LESS accurate than yesterday.
      - name: "Battery Charge Cost Today"
        unique_id: battery_charge_cost_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:battery-charging
        state: >
          {% set nb = states('sensor.battery_charge_daily_night_boost') | float(0) * 0.0824 %}
          {% set n  = states('sensor.battery_charge_daily_night') | float(0) * 0.2438 %}
          {% set d  = states('sensor.battery_charge_daily_day') | float(0) * 0.3233 %}
          {% set p  = states('sensor.battery_charge_daily_peak') | float(0) * 0.4508 %}
          {{ (nb + n + d + p) | round(2) }}

      - name: "Arbitrage Profit Today"
        unique_id: arbitrage_profit_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {{ (states('sensor.arbitrage_today_night_boost') | float(0)
            + states('sensor.arbitrage_today_night') | float(0)
            + states('sensor.arbitrage_today_day') | float(0)
            + states('sensor.arbitrage_today_peak') | float(0)) | round(2) }}

      # Solar is ALREADY inside energy_saving_today: the accurate
      # energy_cost_without_battery_today prices (import + discharge + solar)
      # while energy_cost_today prices import alone, so their difference is
      # (discharge + solar) * rate. The host's version added
      # sensor.solar_value_today on top of that, counting solar twice. That was
      # harmless while the old cost sensors excluded solar, but it becomes a
      # real double-count with the accurate ones — hence this override.
      #
      # The host's "Add Daily Saving at Midnight" automation has the SAME bug
      # (it adds sensor.solar_value_yesterday to input_number.total_energy_savings)
      # and must be fixed too — see README. It has been harmless only because
      # solar_value_yesterday read 0 from a non-existent entity; once that
      # sensor returns real numbers the error starts accumulating permanently.
      - name: "Total Energy Saving"
        unique_id: total_energy_saving
        unit_of_measurement: "EUR"
        state_class: total_increasing
        icon: mdi:piggy-bank
        state: >
          {{ (states('input_number.total_energy_savings') | float(0)
            + states('sensor.energy_saving_today') | float(0)) | round(2) }}

      # ─── YESTERDAY (from utility_meter `last_period`) ───────────
      # Every utility_meter tariff sensor stores its previous completed cycle
      # in a `last_period` attribute (a stringified Decimal, hence the
      # | float(0)), and each tariff sensor keeps its own independently. The
      # meters here are cycle: daily, so `last_period` *is* yesterday —
      # available directly, with no history query and no recorder dependency,
      # and restored across HA restarts.
      #
      # This replaces the heuristics in the host's configuration.yaml, which
      # had only a single daily total to work from and so guessed the tariff
      # split (min(imported, 3.0) as night boost, 10% of the remainder as
      # peak, all battery charging at the night boost rate). Yesterday is now
      # computed exactly like today.
      #
      # It also removes the last consumer of
      # sensor.solar_today_previous_period, retiring the sensor.solar_today
      # Wh/kWh ambiguity entirely rather than working around it.
      #
      # Note: these read 0 until the first midnight after this package is
      # installed, because no cycle has completed yet. They self-correct
      # after one night.
      #
      # sensor.energy_saving_yesterday is deliberately NOT redefined here —
      # it derives purely from the two cost sensors below, so the existing
      # definition in configuration.yaml keeps working untouched.
      - name: "Energy Cost Yesterday"
        unique_id: energy_cost_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        state: >
          {% set standing = 0.9164 %}
          {% set nb = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0) * 0.0824 %}
          {% set n  = state_attr('sensor.grid_import_daily_night', 'last_period') | float(0) * 0.2438 %}
          {% set d  = state_attr('sensor.grid_import_daily_day', 'last_period') | float(0) * 0.3233 %}
          {% set p  = state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) * 0.4508 %}
          {{ (nb + n + d + p + standing) | round(2) }}

      - name: "Energy Cost Without Battery Yesterday"
        unique_id: energy_cost_without_battery_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:currency-eur
        state: >
          {% set standing = 0.9164 %}
          {% set nb = (state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_night_boost', 'last_period') | float(0) + state_attr('sensor.solar_daily_night_boost', 'last_period') | float(0)) * 0.0824 %}
          {% set n  = (state_attr('sensor.grid_import_daily_night', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_night', 'last_period') | float(0) + state_attr('sensor.solar_daily_night', 'last_period') | float(0)) * 0.2438 %}
          {% set d  = (state_attr('sensor.grid_import_daily_day', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_day', 'last_period') | float(0) + state_attr('sensor.solar_daily_day', 'last_period') | float(0)) * 0.3233 %}
          {% set p  = (state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) + state_attr('sensor.battery_discharge_daily_peak', 'last_period') | float(0) + state_attr('sensor.solar_daily_peak', 'last_period') | float(0)) * 0.4508 %}
          {{ (nb + n + d + p + standing) | round(2) }}

      - name: "Arbitrage Profit Yesterday"
        unique_id: arbitrage_profit_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set nb = (state_attr('sensor.battery_discharge_daily_night_boost', 'last_period') | float(0) - state_attr('sensor.battery_charge_daily_night_boost', 'last_period') | float(0)) * 0.0824 %}
          {% set n  = (state_attr('sensor.battery_discharge_daily_night', 'last_period') | float(0) - state_attr('sensor.battery_charge_daily_night', 'last_period') | float(0)) * 0.2438 %}
          {% set d  = (state_attr('sensor.battery_discharge_daily_day', 'last_period') | float(0) - state_attr('sensor.battery_charge_daily_day', 'last_period') | float(0)) * 0.3233 %}
          {% set p  = (state_attr('sensor.battery_discharge_daily_peak', 'last_period') | float(0) - state_attr('sensor.battery_charge_daily_peak', 'last_period') | float(0)) * 0.4508 %}
          {{ (nb + n + d + p) | round(2) }}

      - name: "Battery Charge Cost Yesterday"
        unique_id: battery_charge_cost_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:battery-charging
        state: >
          {% set nb = state_attr('sensor.battery_charge_daily_night_boost', 'last_period') | float(0) * 0.0824 %}
          {% set n  = state_attr('sensor.battery_charge_daily_night', 'last_period') | float(0) * 0.2438 %}
          {% set d  = state_attr('sensor.battery_charge_daily_day', 'last_period') | float(0) * 0.3233 %}
          {% set p  = state_attr('sensor.battery_charge_daily_peak', 'last_period') | float(0) * 0.4508 %}
          {{ (nb + n + d + p) | round(2) }}

      - name: "Solar Yesterday kWh"
        unique_id: solar_yesterday_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {{ (state_attr('sensor.solar_daily_night_boost', 'last_period') | float(0)
            + state_attr('sensor.solar_daily_night', 'last_period') | float(0)
            + state_attr('sensor.solar_daily_day', 'last_period') | float(0)
            + state_attr('sensor.solar_daily_peak', 'last_period') | float(0)) | round(2) }}

      - name: "Solar Value Yesterday"
        unique_id: solar_value_yesterday
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {{ (states('sensor.solar_yesterday_kwh') | float(0) * 0.3233) | round(2) }}

      # Cross-check on the meters. The inverter reports its own yesterday
      # totals (sensor.solis_s6_eh1p_yesterday_*), which are authoritative but
      # carry no tariff split — that missing split is exactly why the cost
      # sensors above use last_period instead of these. Comparing the two
      # catches a meter that lost energy (HA down across a tariff boundary, a
      # restart mid-cycle) instead of letting it silently understate
      # yesterday's cost. Expected ~0; a persistent non-zero value means
      # yesterday's figures are under-counting by that many kWh.
      - name: "Tariff Meter Drift Yesterday"
        unique_id: tariff_meter_drift_yesterday
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:scale-balance
        state: >
          {% set metered = state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0)
            + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0) %}
          {% set inverter = states('sensor.solis_s6_eh1p_yesterday_energy_imported_from_grid') | float(0) %}
          {{ (metered - inverter) | round(3) }}
        attributes:
          metered: >
            {{ (state_attr('sensor.grid_import_daily_night_boost', 'last_period') | float(0)
              + state_attr('sensor.grid_import_daily_night', 'last_period') | float(0)
              + state_attr('sensor.grid_import_daily_day', 'last_period') | float(0)
              + state_attr('sensor.grid_import_daily_peak', 'last_period') | float(0)) | round(3) }}
          inverter: >
            {{ states('sensor.solis_s6_eh1p_yesterday_energy_imported_from_grid') | float(0) | round(3) }}

      # ─── CURRENT PERIOD / RATE ──────────────────────────────────
      # Single source of truth for "which tariff period is it now". Read
      # straight off the select that the utility meters themselves follow,
      # rather than recomputing now().hour a second time — that keeps the
      # boundary logic in exactly one place (the Tariff Period Sync
      # automation below) and makes a stalled sync visible on the dashboard
      # instead of hiding it behind a correct-looking clock.
      - name: "Current Tariff Period"
        unique_id: current_tariff_period
        icon: mdi:clock-outline
        state: "{{ states('select.grid_import_daily') }}"

      # Replaces the hour-based template of the same unique_id in the host's
      # configuration.yaml — that block must be deleted there, see README.
      # `availability` deliberately makes an unsynced select surface as
      # unavailable rather than silently reporting the day rate.
      - name: "Electricity Rate"
        unique_id: electricity_rate_yaml
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >
          {{ states('sensor.current_tariff_period') in ['night_boost', 'night', 'day', 'peak'] }}
        state: >
          {% set rates = {'night_boost': 0.0824, 'night': 0.2438, 'day': 0.3233, 'peak': 0.4508} %}
          {{ rates[states('sensor.current_tariff_period')] }}

      # ─── SOLAR TODAY (UNAMBIGUOUS kWh) ──────────────────────────
      # Summed from the four solar_daily_* tariff buckets, whose source is
      # the confirmed-kWh sensor.solar_total_yield. The four selects are
      # always switched together by Tariff Period Sync, so the buckets
      # partition the day without overlap and this sum is today's total.
      # Exists so no consumer has to remember the sensor.solar_today Wh
      # gotcha — there is deliberately no /1000 anywhere in this chain.
      - name: "Solar Today kWh"
        unique_id: solar_today_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ (states('sensor.solar_daily_night_boost') | float(0)
            + states('sensor.solar_daily_night') | float(0)
            + states('sensor.solar_daily_day') | float(0)
            + states('sensor.solar_daily_peak') | float(0)) | round(2) }}

      # Replaces the sensor.solar_today-based template of the same unique_id
      # in the host's configuration.yaml — that block must be deleted there.
      # sensor.total_energy_saving folds this into the lifetime accumulator,
      # so sourcing it from the unambiguous sensor above keeps a unit error
      # from becoming permanent.
      - name: "Solar Value Today"
        unique_id: solar_value_today
        unit_of_measurement: "EUR"
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {{ (states('sensor.solar_today_kwh') | float(0) * 0.3233) | round(2) }}

automation:
  - alias: "Tariff Period Sync"
    id: tariff_period_sync
    trigger:
      - platform: time
        at: "02:00:00"
      - platform: time
        at: "05:00:00"
      - platform: time
        at: "08:00:00"
      - platform: time
        at: "17:00:00"
      - platform: time
        at: "19:00:00"
      - platform: time
        at: "23:00:00"
      - platform: homeassistant
        event: start
      # Self-healing: if an exact-boundary trigger is missed (DST, clock
      # skew, brief HA unavailability), this re-fires the idempotent
      # select.select_option every 15 min so the period self-corrects
      # within 15 minutes instead of staying wrong until the next boundary.
      - platform: time_pattern
        minutes: "/15"
    action:
      - variables:
          period: >
            {% set hour = now().hour %}
            {% if hour >= 2 and hour < 5 %}
              night_boost
            {% elif hour >= 17 and hour < 19 %}
              peak
            {% elif hour >= 23 or hour < 8 %}
              night
            {% else %}
              day
            {% endif %}
      - service: select.select_option
        target:
          entity_id:
            - select.grid_import_daily
            - select.battery_charge_daily
            - select.battery_discharge_daily
            - select.solar_daily
        data:
          option: "{{ period }}"

  - alias: "Tariff Period Savings Midnight Rollup"
    id: tariff_period_savings_midnight_rollup
    trigger:
      # 23:59:59, as close to the 00:00:00 utility_meter daily reset as
      # possible, to shrink (but not eliminate) the race between this
      # read-then-write rollup and the meter resetting — a known, accepted
      # small edge case, not something this fix fully solves.
      - platform: time
        at: "23:59:59"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_night_boost
        data:
          value: "{{ (states('input_number.total_saving_night_boost') | float(0) + states('sensor.saving_today_night_boost') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_night
        data:
          value: "{{ (states('input_number.total_saving_night') | float(0) + states('sensor.saving_today_night') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_day
        data:
          value: "{{ (states('input_number.total_saving_day') | float(0) + states('sensor.saving_today_day') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_saving_peak
        data:
          value: "{{ (states('input_number.total_saving_peak') | float(0) + states('sensor.saving_today_peak') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_night_boost
        data:
          value: "{{ (states('input_number.total_arbitrage_night_boost') | float(0) + states('sensor.arbitrage_today_night_boost') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_night
        data:
          value: "{{ (states('input_number.total_arbitrage_night') | float(0) + states('sensor.arbitrage_today_night') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_day
        data:
          value: "{{ (states('input_number.total_arbitrage_day') | float(0) + states('sensor.arbitrage_today_day') | float(0)) | round(2) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.total_arbitrage_peak
        data:
          value: "{{ (states('input_number.total_arbitrage_peak') | float(0) + states('sensor.arbitrage_today_peak') | float(0)) | round(2) }}"

panel_custom:
  - name: energy-dashboard
    sidebar_title: Energy
    sidebar_icon: mdi:lightning-bolt
    url_path: energy-dashboard
    module_url: /hacsfiles/HA-App/energy-dashboard.js
