          {% set ni = (states('sensor.battery_discharge_daily_night') | float(0) + states('sensor.solar_daily_night') | float(0)) * states('input_number.rate_night') | float(0.2778) %}
          {% set da = (states('sensor.battery_discharge_daily_day') | float(0) + states('sensor.solar_daily_day') | float(0)) * states('input_number.rate_day') | float(0.3578) %}
