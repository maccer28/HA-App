          {% set chg = states('sensor.battery_charge_daily_night_boost') | float(0) + states('sensor.battery_charge_daily_night') | float(0) + states('sensor.battery_charge_daily_day') | float(0) + states('sensor.battery_charge_daily_peak') | float(0) %}
          {% set dis = states('sensor.battery_discharge_daily_night_boost') | float(0) + states('sensor.battery_discharge_daily_night') | float(0) + states('sensor.battery_discharge_daily_day') | float(0) + states('sensor.battery_discharge_daily_peak') | float(0) %}
